<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | فایلینو</title><link rel="stylesheet" href="admin.css"></head><body><div id="login" class="screen"><div class="login-card"><div class="brand">فایلینو<span>.</span></div><h1>ورود مدیر</h1><p>برای ورود به پنل مدیریت، ایمیل و رمز عبور حساب مدیر را وارد کنید.</p><input id="email" type="email" placeholder="ایمیل مدیر"><input id="password" type="password" placeholder="رمز عبور"><button onclick="login()">ورود به پنل</button><div id="loginMsg" class="msg"></div><a href="index.html">← بازگشت به فروشگاه</a></div></div><div id="app" class="app hidden"><aside><div class="brand">فایلینو<span>.</span></div><nav><button class="active" onclick="showTab('dashboard',this)">📊 داشبورد</button><button onclick="showTab('products',this)">📦 محصولات</button><button onclick="showTab('orders',this)">🧾 سفارش‌ها</button></nav><button class="logout" onclick="logout()">خروج</button></aside><main><header><div><small>مدیریت فروشگاه</small><h1 id="pageTitle">داشبورد</h1></div><span id="adminEmail"></span></header><section id="dashboard" class="tab"><div class="stats"><div><span>💰</span><small>درآمد پرداخت‌شده</small><strong id="revenue">۰ تومان</strong></div><div><span>🧾</span><small>سفارش‌ها</small><strong id="ordersCount">۰</strong></div><div><span>📦</span><small>محصولات فعال</small><strong id="productsCount">۰</strong></div><div><span>⏳</span><small>در انتظار پرداخت</small><strong id="pendingCount">۰</strong></div></div><div class="panel"><h2>آخرین سفارش‌ها</h2><div id="recentOrders"></div></div></section><section id="products" class="tab hidden"><div class="toolbar"><h2>مدیریت محصولات</h2><button onclick="openProduct()">＋ محصول جدید</button></div><div class="panel"><div id="productsTable"></div></div></section><section id="orders" class="tab hidden"><div class="toolbar"><h2>سفارش‌ها</h2><button onclick="loadAll()">↻ بروزرسانی</button></div><div class="panel"><div id="ordersTable"></div></div></section></main></div><div id="productModal" class="modal hidden"><div class="modal-card"><button class="close" onclick="closeProduct()">×</button><h2 id="modalTitle">محصول جدید</h2><input id="pName" placeholder="نام محصول"><select id="pCategory"><option value="study">📚 دانش‌آموزی</option><option value="design">🎨 طراحی</option><option value="business">💼 کسب‌وکار</option><option value="tools">🤖 ابزار</option></select><input id="pPrice" type="number" min="0" placeholder="قیمت به تومان"><textarea id="pDesc" placeholder="توضیحات"></textarea><input id="pFile" placeholder="مسیر فایل در Storage، مثال: products/file.zip"><label class="check"><input id="pActive" type="checkbox" checked> محصول فعال باشد</label><button onclick="saveProduct()">ذخیره محصول</button><div id="productMsg" class="msg"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
